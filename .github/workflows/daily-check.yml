name: MonacOut — Nettoyage & Police

on:
  schedule:
    - cron: '0 4 * * *'    # 6h00 Monaco (UTC+2 en été)
    - cron: '0 16 * * *'   # 18h00 Monaco (UTC+2 en été)
  workflow_dispatch:         # lancement manuel depuis GitHub

jobs:
  police:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Configurer Git
        run: |
          git config user.name "MonacOut Bot"
          git config user.email "noreply@github.com"

      - name: Nettoyage des événements passés
        run: node cleanup-events.mjs

      - name: Auto-correction des dates vs PrinciPocket
        run: node cross-check-dates.mjs
        continue-on-error: true   # réseau : ne bloque pas si PrinciPocket est down

      - name: 📋 Scan complétude PrinciPocket (events manquants → rapport, sans email)
        run: node principocket-scan.mjs
        continue-on-error: true   # réseau : ne bloque pas si PrinciPocket est down

      # Reprise INTÉGRALE de PrinciPocket, avec registre persistant. Ne dépend plus de
      # ce qu'un humain pense à relancer : tourne deux fois par jour, garde la trace
      # de chaque événement vu, et passe au ROUGE si quelque chose est écarté depuis
      # plus de 3 jours sans que personne s'en occupe.
      - name: "📥 Reprise intégrale PrinciPocket (registre + alerte)"
        id: import
        run: node scripts/import-principocket.mjs
        continue-on-error: true

      - name: "🤖 Auto-complétion (robot déterministe : ajoute les manquants 100 % sûrs)"
        run: node scripts/auto-complete-events.mjs
        continue-on-error: true   # n'ajoute que lieu+date+heure confirmés ; Le Policier valide juste après

      # Plannings des deux piscines, relus dans les PDF de la Mairie. Leur adresse
      # change à chaque mise à jour, et le PDF retenu est celui dont la PÉRIODE
      # couvre aujourd'hui — sans ça le script servait le planning de juin en août.
      - name: "🏊 Plannings des piscines (lus dans les PDF de la Mairie)"
        id: piscines
        run: node scripts/piscines.mjs
        continue-on-error: true

      - name: 🍸 Régénère les récurrences nightlife (fenêtre glissante 12 mois, idempotent)
        run: node scripts/restore-nightlife-monthly.mjs

      # APRÈS le générateur nightlife, et c'est essentiel : celui-ci recrée les fiches
      # « le lieu est ouvert » à chaque passage, celui-là les refond en UNE fiche par
      # jour. L'ordre inverse laisserait 1 200 fiches d'apéro revenir deux fois par jour.
      # Rejouable par construction : reconstruit tout depuis sa config d'horaires
      # vérifiés, ne dépend d'aucune fiche existante. Même garde-fou que les autres.
      - name: "🏛️ Une fiche musées par jour (nombre réellement ouvert)"
        id: musees
        run: node scripts/musees-du-jour.mjs
        continue-on-error: true

      - name: "🍸 Une fiche par jour pour les lieux simplement ouverts"
        id: soirees
        run: node scripts/soirees-du-jour.mjs
        continue-on-error: true

      - name: 🚓 LE POLICIER — autofix + contrôle (dates, géo, liens, noms, traduction)
        id: police
        run: node police-events.mjs
        continue-on-error: true   # on capture le verdict, on pousse les corrections, puis on alerte

      - name: 🧹 Dédupliquer les événements (anti-doublons du scan auto)
        run: node scripts/dedup-events.mjs

      - name: 🎬 Rafraîchir la carte cinéma (date du jour)
        run: node scripts/refresh-cinema.mjs

      # DÉBRANCHÉ le 11 août 2026. Le carré d'annonce a été retiré du code, mais les
      # apps restées sur un ancien bundle OTA l'affichaient encore (19 personnes
      # déclenchaient annonce_vue sur 3 jours) — avec un bouton « Découvrir » qui
      # ouvrait un site externe, la cause de l'écran noir. public/notif-config.json
      # étant lu en direct, `announcement: null` l'éteint partout, anciennes versions
      # comprises ; il ne faut donc plus que ce script le régénère.
      # - name: 🔔 Recalcule le repli du bandeau annonce (Ce soir / Demain soir)
      #   run: node scripts/refresh-announcement.mjs

      # Le robot tourne ici (GitHub Actions), où PrinciPocket est joignable — ce n'est
      # PAS le cas depuis le cloud Anthropic. On commite donc sa liste de lieux à
      # compléter pour que l'agent chercheur puisse la lire sans refaire le scan.
      - name: "🔎 Contrôle qualité des fiches (signale, ne corrige pas)"
        run: node scripts/quality-check.mjs
        continue-on-error: true

      - name: Build & push des corrections automatiques
        run: |
          # ⚠️ Ces deux fichiers n'existent pas à tous les passages (le robot ne les écrit
          # que s'il a quelque chose à signaler). Toujours tester leur présence : un
          # « git add » sur un fichier absent renvoie 128 et casse toute l'étape.
          for f in lieux-a-completer.txt auto-complete-report.txt qualite-a-ameliorer.txt soirees-du-jour.txt soirees-du-jour.json musees-du-jour.txt liens-morts.txt import-principocket.txt principocket-registre.json piscines.txt; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --quiet --cached || ! git diff --quiet src/data/events.js public/notif-config.json; then
            npm run build
            git add src/data/events.js public/notif-config.json public/events.json public/widget-events.json
            git commit -m "chore: maj auto (events + bandeau ce soir/demain) ($(date +%Y-%m-%d))"
            git push
          fi

      # Placé APRÈS le build : le script y lit les identifiants Supabase publics
      # quand .env.local n'existe pas (cas du CI). Un lien d'invitation cassé est
      # invisible — personne ne signale une amitié qui ne s'est jamais faite.
      # Un lien mort est invisible de nous et visible d'eux : « Réserver » ouvre une
      # page vide. smakelijk-restaurant.com l'est resté des semaines sur 27 fiches.
      - name: "🔗 Liens des fiches (mortels seulement, identité iPhone)"
        id: liens
        run: node scripts/check-links.mjs
        continue-on-error: true

      - name: "💌 Chaîne d'invitation (code, garde-fou, adresse)"
        id: invitations
        run: node scripts/check-invitations.mjs
        continue-on-error: true

      - name: Vérification réseau des liens (santé des billetteries)
        id: verify
        run: node verify-events.mjs
        continue-on-error: true

      # Ces trois contrôles tournent APRÈS le push ci-dessus (ils ont besoin du build).
      # Leurs rapports n'étaient donc JAMAIS commités : le message d'erreur renvoyait
      # vers un liens-morts.txt vieux de plusieurs jours qui disait « aucun lien mort »,
      # pendant que l'étape en signalait deux. Une alerte qui pointe vers un fichier
      # périmé ne vaut pas mieux que pas d'alerte.
      - name: "📄 Publier les rapports des contrôles d'après-build"
        if: always()
        continue-on-error: true
        run: |
          for f in liens-morts.txt verify-events-report.txt; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --quiet --cached; then
            git commit -m "chore: rapports de controle ($(date +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi

      - name: Alerte email si le policier ou la vérif ont signalé un problème
        if: steps.police.outcome == 'failure' || steps.verify.outcome == 'failure'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node send-alert-email.mjs

      - name: Statut final (échec visible si le policier ou les invitations ont vu rouge)
        if: steps.police.outcome == 'failure' || steps.invitations.outcome == 'failure' || steps.liens.outcome == 'failure' || steps.import.outcome == 'failure' || steps.piscines.outcome == 'failure' || steps.soirees.outcome == 'failure' || steps.musees.outcome == 'failure'
        run: |
          if [ "${{ steps.soirees.outcome }}" = "failure" ]; then
            echo "::error::Les fiches « ce soir » n ont pas pu etre reconstruites — registre soirees-du-jour.json vide ou illisible. Le fil est INCHANGE, rien n a ete perdu."
          fi
          if [ "${{ steps.piscines.outcome }}" = "failure" ]; then
            echo "::error::Un planning de piscine n a pas pu etre lu — voir piscines.txt. Les fiches existantes ont ete conservees."
          fi
          if [ "${{ steps.import.outcome }}" = "failure" ]; then
            echo "::error::Des evenements PrinciPocket sont ecartes depuis plus de 3 jours — voir import-principocket.txt."
          fi
          if [ "${{ steps.liens.outcome }}" = "failure" ]; then
            echo "::error::Des liens de fiches sont morts — voir liens-morts.txt et l étape « Liens des fiches »."
          fi
          if [ "${{ steps.invitations.outcome }}" = "failure" ]; then
            echo "::error::La chaîne d'invitation est cassée — voir l'étape « Chaîne d'invitation » ci-dessus."
          fi
          if [ "${{ steps.police.outcome }}" = "failure" ]; then
            echo "::error::Le policier a détecté des fautes critiques non corrigeables automatiquement — rapport envoyé par email."
          fi
          exit 1
