name: MonacOut — Ajout automatique d'événements

on:
  schedule:
    - cron: '0 6 * * *'    # 8h00 Monaco (UTC+2 en été)
    - cron: '0 12 * * *'   # 14h00 Monaco (UTC+2 en été)
  workflow_dispatch:         # lancement manuel depuis GitHub

jobs:
  auto-events:
    # 🚨 ÉPINGLÉ À 24.04, PAS « latest ». Le 18 nov 2026, GitHub a basculé
    # `ubuntu-latest` sur Ubuntu 26.04 — que Playwright 1.60 ne sait pas
    # installer : « ERROR: Playwright does not support chromium on
    # ubuntu26.04-x64 ». Tous les scripts qui lisent une page au navigateur se
    # sont arrêtés d'un coup, sans que personne ne change une ligne de code.
    # ⚠️ « latest » veut dire « ce que GitHub décidera demain » : pour une
    #    chaîne qui dépend d'un navigateur, c'est une dépendance non maîtrisée.
    #    À relever quand Playwright annoncera la prise en charge de 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Installer Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Configurer Git
        run: |
          git config user.name "MonacOut Bot"
          git config user.email "noreply@github.com"

      - name: Scraper et insérer les nouveaux événements
        run: node auto-events.mjs
        continue-on-error: true

      - name: Rapport
        run: cat auto-events-report.txt 2>/dev/null || echo "Aucun rapport généré"
